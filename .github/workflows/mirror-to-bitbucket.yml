name: Mirror to Bitbucket

on:
  push:
    branches:
      - main
  schedule:
    # каждый час, автоматически
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: mirror-to-bitbucket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to Bitbucket
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          git remote remove bitbucket 2>/dev/null || true
          git remote add bitbucket "https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/safe-sever/safe-server-lists.git"

          for attempt in 1 2 3 4 5; do
            echo "Bitbucket push attempt $attempt/5"

            if git push bitbucket HEAD:main --force; then
              echo "✅ Bitbucket push successful"
              exit 0
            fi

            sleep_time=$((attempt * 45))
            echo "❌ Push failed. Sleeping ${sleep_time}s..."
            sleep "$sleep_time"
          done

          echo "💀 Bitbucket push failed after all retries"
          exit 1
