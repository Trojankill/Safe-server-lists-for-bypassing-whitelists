name: Mirror to Bitbucket

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mirror-to-bitbucket
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      BITBUCKET_REPO: ${{ vars.BITBUCKET_REPO }}
      BITBUCKET_BRANCH: ${{ vars.BITBUCKET_BRANCH }}
      BITBUCKET_EMAIL: ${{ vars.BITBUCKET_EMAIL }}
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_MIRROR_TOKEN }}

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Upload files via Bitbucket REST API
        run: |
          set -euo pipefail

          if [ -z "${BITBUCKET_REPO:-}" ] || [ -z "${BITBUCKET_EMAIL:-}" ] || [ -z "${BITBUCKET_TOKEN:-}" ]; then
            echo "❌ Missing Variables/Secrets. Need BITBUCKET_REPO, BITBUCKET_EMAIL, BITBUCKET_MIRROR_TOKEN."
            exit 1
          fi

          BB_BRANCH="${BITBUCKET_BRANCH:-main}"

          # Собираем аргументы для curl
          CURL_ARGS=(
            -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_REPO}/src"
            -u "${BITBUCKET_EMAIL}:${BITBUCKET_TOKEN}"
            -F "branch=${BB_BRANCH}"
            -F "message=mirror update $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          )

          # Добавляем каждый существующий txt файл
          for file in "$GITHUB_WORKSPACE"/githubmirror/FILTER-*.txt "$GITHUB_WORKSPACE"/githubmirror/ALL.txt; do
            if [ -f "$file" ] && [ -s "$file" ]; then
              filename=$(basename "$file")
              CURL_ARGS+=(-F "${filename}=@${file}")
            fi
          done

          if [ ${#CURL_ARGS[@]} -eq 4 ]; then
            echo "⚠️ No non-empty txt files found to upload."
            exit 0
          fi

          echo "🚀 Uploading files to Bitbucket via REST API..."
          RESPONSE=$(curl "${CURL_ARGS[@]}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "201" ]; then
            echo "✅ Bitbucket files replaced successfully via API!"
          else
            echo "❌ API upload failed with status $HTTP_STATUS"
            echo "Response: $RESPONSE"
            exit 1
          fi
