name: Auto Update Proxy Filters

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Setup Xray-core
        run: |
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray
          chmod +x xray/xray
          echo "$(pwd)/xray" >> $GITHUB_PATH

      - name: Run filter script
        run: python filter.py

      - name: Commit and push changes
        run: |
          git add githubmirror/FILTER-*.txt githubmirror/FAST-server.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "auto-update filters ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push --force-with-lease origin main
