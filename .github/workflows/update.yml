name: Auto Update Proxy Filters

on:
  workflow_dispatch:
  # schedule убран — cron-job.org дергает workflow_dispatch каждую минуту через API

concurrency:
  group: proxy-filter-update
  cancel-in-progress: false

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install qrcode[pil]

      - name: Run filter script
        id: filter
        run: |
          python filter.py
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.filter.outputs.status == 'success'
        run: |
          git add githubmirror/FILTER-*.txt \
                  githubmirror/ALL.txt \
                  githubmirror/url_health.json \
                  githubmirror/URL_HEALTH_REPORT.md \
                  QR-CODE/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto-update filters + QR ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main

  mirror-to-bitbucket:
    needs: update-files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main branch to Bitbucket
        env:
          BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          git remote remove bitbucket 2>/dev/null || true
          git remote add bitbucket "https://x-token-auth:${BITBUCKET_TOKEN}@bitbucket.org/trojankill/safe-server-lists.git"
          for attempt in 1 2 3 4 5; do
            echo "Bitbucket push attempt $attempt/5"
            if git push bitbucket HEAD:main --force; then
              echo "✅ Bitbucket push successful"
              exit 0
            fi
            sleep_time=$((attempt * 45))
            echo "❌ Push failed. Sleeping ${sleep_time}s..."
            sleep "$sleep_time"
          done
          echo "💀 Bitbucket push failed after all retries"
          exit 1
