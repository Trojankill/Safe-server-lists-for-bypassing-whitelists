name: Auto Update Proxy Filters

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Force sync with remote (avoid non-fast-forward)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Run filter script
        run: python filter.py

      - name: Commit and push changes
        run: |
          git add githubmirror/FILTER-*.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto-update filters ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push --force-with-lease origin main
