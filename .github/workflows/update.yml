name: Auto Update Proxy Filters

on:
  schedule:
    - cron: "*/9 * * * *"
  workflow_dispatch:

concurrency:
  group: proxy-filter-update
  cancel-in-progress: true

jobs:
  update-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install qrcode[pil]

      - name: Run filter script
        id: filter
        run: |
          python filter.py
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.filter.outputs.status == 'success'
        run: |
          git add githubmirror/FILTER-*.txt \
                  githubmirror/ALL.txt \
                  githubmirror/url_health.json \
                  githubmirror/URL_HEALTH_REPORT.md \
                  QR-CODE/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto-update filters + QR ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main
